services:
  postgres:
    image: postgres:16-alpine
    container_name: pps_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pps_db}
      POSTGRES_USER: ${DB_USER:-user_pps}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - pps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user_pps} -d ${DB_NAME:-pps_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pps_postgres_data:
